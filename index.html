<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard HSE — Somec Navale</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --blue:#1a4a7a; --blue-mid:#2563a8; --blue-light:#e8f0fa;
  --orange:#d04a1a; --green:#1a7a4a; --green-bg:#e8f5ee;
  --amber:#a06010; --amber-bg:#fff8e8;
  --red:#c0392b; --red-bg:#fdecea;
  --gray-bg:#f0f2f5; --gray-border:#d0d4da; --gray-mid:#7a8090;
  --text:#1a1e28; --white:#ffffff;
  --radius:8px; --shadow:0 2px 8px rgba(0,0,0,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--gray-bg);color:var(--text);min-height:100vh}

/* HEADER */
.header{background:var(--blue);color:#fff;padding:0}
.header-inner{max-width:1200px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.header-brand{display:flex;align-items:center;gap:12px}
.header-logo img{height:40px;filter:brightness(0) invert(1)}
.header-title{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.9}
.header-title span{color:var(--orange);display:block;font-size:11px}
.header-badge{background:rgba(255,255,255,.15);border-radius:20px;padding:4px 12px;font-size:11px;font-weight:600}

/* FILTRI */
.filters-bar{background:var(--white);border-bottom:1px solid var(--gray-border);padding:12px 20px;position:sticky;top:0;z-index:100;box-shadow:var(--shadow)}
.filters-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.filter-group{display:flex;align-items:center;gap:6px}
.filter-label{font-size:11px;font-weight:700;color:var(--gray-mid);text-transform:uppercase;letter-spacing:.04em}
.filter-select{border:1px solid var(--gray-border);border-radius:var(--radius);padding:6px 10px;font-size:13px;font-family:inherit;color:var(--text);background:#fff;cursor:pointer}
.filter-select:focus{outline:none;border-color:var(--blue-mid)}
.btn-refresh{background:var(--blue);color:#fff;border:none;border-radius:var(--radius);padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:5px}
.btn-refresh:hover{background:var(--blue-mid)}
.last-update{font-size:11px;color:var(--gray-mid);margin-left:auto}

/* MAIN */
.main{max-width:1200px;margin:0 auto;padding:20px}

/* OVERVIEW CARDS */
.overview-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
@media(max-width:900px){.overview-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.overview-grid{grid-template-columns:1fr 1fr}}
.ov-card{background:var(--white);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px}
.ov-card .ov-icon{font-size:24px;margin-bottom:4px}
.ov-card .ov-num{font-size:28px;font-weight:800;line-height:1}
.ov-card .ov-label{font-size:11px;font-weight:600;color:var(--gray-mid);text-transform:uppercase;letter-spacing:.04em}
.ov-card .ov-sub{font-size:11px;color:var(--gray-mid);margin-top:2px}
.ov-card.green .ov-num{color:var(--green)}
.ov-card.amber .ov-num{color:var(--amber)}
.ov-card.red   .ov-num{color:var(--red)}
.ov-card.blue  .ov-num{color:var(--blue)}

/* SPI SECTION */
.section-title{font-size:14px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.section-title::after{content:'';flex:1;height:1px;background:var(--gray-border)}

/* SPI CARDS */
.spi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-bottom:24px}
.spi-card{background:var(--white);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);border-left:4px solid var(--gray-border)}
.spi-card.ottimo   {border-left-color:#1a7a4a}
.spi-card.buono    {border-left-color:#2ecc71}
.spi-card.discreto {border-left-color:#f39c12}
.spi-card.sufficiente{border-left-color:#e67e22}
.spi-card.insufficiente{border-left-color:#e74c3c}
.spi-card.gravemente{border-left-color:#c0392b}
.spi-card.nd       {border-left-color:#bdc3c7}
.spi-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.spi-name{font-size:12px;font-weight:700;color:var(--text);text-transform:uppercase;letter-spacing:.03em}
.spi-peso{font-size:10px;color:var(--gray-mid);background:var(--gray-bg);border-radius:10px;padding:2px 7px}
.spi-score-row{display:flex;align-items:baseline;gap:6px;margin-bottom:6px}
.spi-score{font-size:32px;font-weight:800;line-height:1}
.spi-score.ottimo   {color:#1a7a4a}
.spi-score.buono    {color:#27ae60}
.spi-score.discreto {color:#f39c12}
.spi-score.sufficiente{color:#e67e22}
.spi-score.insufficiente{color:#e74c3c}
.spi-score.gravemente{color:#c0392b}
.spi-score.nd       {color:#bdc3c7}
.spi-max{font-size:14px;color:var(--gray-mid)}
.spi-bar-wrap{background:#f0f2f5;border-radius:10px;height:6px;overflow:hidden;margin-bottom:6px}
.spi-bar{height:6px;border-radius:10px;transition:width .6s ease}
.spi-giudizio{font-size:11px;font-weight:700;letter-spacing:.04em}
.spi-detail{font-size:11px;color:var(--gray-mid);margin-top:4px}

/* VOTO FINALE */
.voto-card{background:var(--white);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);margin-bottom:24px;display:flex;align-items:center;gap:24px}
@media(max-width:600px){.voto-card{flex-direction:column;text-align:center}}
.voto-circle{width:120px;height:120px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;font-weight:800}
.voto-circle .voto-num{font-size:36px;line-height:1}
.voto-circle .voto-max{font-size:14px;opacity:.7}
.voto-info h2{font-size:20px;font-weight:800;margin-bottom:4px}
.voto-info p{font-size:13px;color:var(--text-light);line-height:1.5}
.voto-info .voto-implic{margin-top:8px;padding:8px 12px;border-radius:var(--radius);font-size:12px;font-weight:600}

/* TABELLE */
.table-card{background:var(--white);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:24px}
.data-table{width:100%;border-collapse:collapse;font-size:12px}
.data-table th{background:var(--blue);color:#fff;padding:8px 10px;text-align:left;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.data-table td{padding:8px 10px;border-bottom:1px solid #f0f2f5;vertical-align:middle}
.data-table tr:last-child td{border-bottom:none}
.data-table tr:nth-child(even) td{background:#fafbfc}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;text-transform:uppercase}
.badge.ottimo   {background:#e8f5ee;color:#1a7a4a}
.badge.buono    {background:#eafaf1;color:#27ae60}
.badge.discreto {background:#fef9e7;color:#f39c12}
.badge.sufficiente{background:#fdf2e9;color:#e67e22}
.badge.insufficiente{background:#fdedec;color:#e74c3c}
.badge.gravemente{background:#fdecea;color:#c0392b}
.badge.nd       {background:#f0f2f5;color:#7f8c8d}

/* CHARTS */
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:24px}
@media(max-width:700px){.chart-grid{grid-template-columns:1fr}}
.chart-card{background:var(--white);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.chart-title{font-size:12px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.04em;margin-bottom:12px}

/* NC TOP */
.nc-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f0f2f5}
.nc-row:last-child{border-bottom:none}
.nc-rank{font-size:18px;font-weight:800;color:var(--gray-mid);width:28px;flex-shrink:0;text-align:center}
.nc-text{flex:1;font-size:12px;color:var(--text);line-height:1.3}
.nc-sezione{font-size:10px;color:var(--gray-mid);display:block;margin-top:2px}
.nc-count{font-size:16px;font-weight:800;color:var(--red)}

/* LOADING */
.loading{text-align:center;padding:60px 20px;color:var(--gray-mid)}
.spinner{width:40px;height:40px;border:4px solid #e0e4ea;border-top-color:var(--blue);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}

/* EMPTY */
.empty-state{text-align:center;padding:40px;color:var(--gray-mid);font-size:13px}

/* RESPONSIVE */
@media(max-width:600px){
  .filters-inner{gap:8px}
  .spi-grid{grid-template-columns:1fr}
  .main{padding:12px}
}
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="header-brand">
      <div class="header-title">SOMEC NAVALE<span>HSE Dashboard</span></div>
    </div>
    <div class="header-badge" id="hdr-period">Caricamento...</div>
  </div>
</div>

<div class="filters-bar">
  <div class="filters-inner">
    <div class="filter-group">
      <span class="filter-label">Anno</span>
      <select class="filter-select" id="f-anno" onchange="loadData()">
        <option value="2026">2026</option>
        <option value="2025">2025</option>
      </select>
    </div>
    <div class="filter-group">
      <span class="filter-label">Trimestre</span>
      <select class="filter-select" id="f-trim" onchange="loadData()">
        <option value="Q1">Q1 (Gen-Mar)</option>
        <option value="Q2">Q2 (Apr-Giu)</option>
        <option value="Q3">Q3 (Lug-Set)</option>
        <option value="Q4">Q4 (Ott-Dic)</option>
      </select>
    </div>
    <div class="filter-group">
      <span class="filter-label">Sito</span>
      <select class="filter-select" id="f-sito" onchange="loadData()">
        <option value="ALL">Tutti i siti</option>
        <option value="Genova (Fincantieri)">Genova</option>
        <option value="Marghera (Fincantieri)">Marghera</option>
        <option value="Monfalcone (Fincantieri)">Monfalcone</option>
        <option value="Turku (Meyer)">Turku</option>
        <option value="Saint-Nazaire (Chantiers de l'Atlantique)">Saint-Nazaire</option>
        <option value="Papenburg (Meyer Werft)">Papenburg</option>
        <option value="Stabilimento Somec — sede principale">Stabilimento</option>
      </select>
    </div>
    <button class="btn-refresh" onclick="loadData()">↻ Aggiorna</button>
    <span class="last-update" id="last-update"></span>
  </div>
</div>

<div class="main">
  <div id="dashboard-content">
    <div class="loading">
      <div class="spinner"></div>
      <div>Caricamento dati da Firestore...</div>
    </div>
  </div>
</div>

<script>
// ── FIREBASE ──────────────────────────────────────────────
firebase.initializeApp({
  apiKey:"AIzaSyDDwVVkLyfanLnXB58aozMuMRkx1kZPmBg",
  authDomain:"somec-hse.firebaseapp.com",
  projectId:"somec-hse",
  storageBucket:"somec-hse.firebasestorage.app",
  messagingSenderId:"547746230687",
  appId:"1:547746230687:web:608c805c18bb1792134daa"
});
const db = firebase.firestore();

// ── PESI SPI (11 indici — Q2 2026+) ──────────────────────
const SPI_CONFIG = [
  { id:'infortuni',    nome:'Infortuni (gg assenza)',           peso:18, max:5, fonte:'safereport' },
  { id:'nearmiss',     nome:'Near Miss',                        peso:13, max:5, fonte:'safereport' },
  { id:'segnalazioni', nome:'Segnalazioni cantiere',            peso:13, max:5, fonte:'safereport' },
  { id:'procedure',    nome:'Procedure sicurezza',              peso:7,  max:5, fonte:'audit_interviste' },
  { id:'dpi',          nome:'DPI utilizzo/controllo',           peso:11, max:5, fonte:'audit_dpi' },
  { id:'ispezioni',    nome:'Giorni di ispezione',              peso:13, max:5, fonte:'audit_hse' },
  { id:'ore',          nome:'Ore lavorate',                     peso:13, max:5, fonte:'manuale' },
  { id:'unsafe',       nome:'Unsafe Acts/Conditions',           peso:9,  max:5, fonte:'audit_hse' },
  { id:'ac_chiusura',  nome:'Chiusura Azioni Correttive',       peso:8,  max:5, fonte:'audit_hse' },
  { id:'conformita',   nome:'Conformità Documentale',           peso:6,  max:5, fonte:'audit_hse' },
  { id:'formazione',   nome:'Formazione/Briefing erogati',      peso:5,  max:5, fonte:'preposti' },
];

const BANDE = [
  { min:83, max:100, label:'OTTIMO',                  cls:'ottimo',      color:'#1a7a4a', bg:'#e8f5ee',
    implic:'Riconoscimento formale. Best practice da condividere con gli altri cantieri.' },
  { min:70, max:83,  label:'BUONO',                   cls:'buono',       color:'#27ae60', bg:'#eafaf1',
    implic:'Monitoraggio ordinario trimestrale.' },
  { min:60, max:70,  label:'DISCRETO',                cls:'discreto',    color:'#f39c12', bg:'#fef9e7',
    implic:'Verifica trimestrale di mantenimento standard.' },
  { min:40, max:60,  label:'SUFFICIENTE',             cls:'sufficiente', color:'#e67e22', bg:'#fdf2e9',
    implic:'Formazione entro 3 mesi + verifica trimestrale.' },
  { min:20, max:40,  label:'INSUFFICIENTE',           cls:'insufficiente',color:'#e74c3c',bg:'#fdedec',
    implic:'Comunicazione ufficiale entro 1 mese + formazione mirata + verifica mensile.' },
  { min:0,  max:20,  label:'GRAVEMENTE INSUFFICIENTE',cls:'gravemente',  color:'#c0392b', bg:'#fdecea',
    implic:'Comunicazione ufficiale entro 15 gg + piano azione + valutazione esclusione parco fornitori.' },
];

function getBanda(voto) {
  return BANDE.find(b => voto >= b.min && voto <= b.max) || BANDE[BANDE.length-1];
}

// ── STATO ─────────────────────────────────────────────────
let DATA = { audits:[], safereports:[], preposti:[] };

// ── INIT ──────────────────────────────────────────────────
window.addEventListener('load', () => {
  // Imposta trimestre corrente
  const m = new Date().getMonth() + 1;
  const q = m<=3?'Q1':m<=6?'Q2':m<=9?'Q3':'Q4';
  document.getElementById('f-trim').value = q;
  document.getElementById('f-anno').value = new Date().getFullYear();
  loadData();
});

// ── CARICA DATI ───────────────────────────────────────────
async function loadData() {
  const anno = parseInt(document.getElementById('f-anno').value);
  const trim = document.getElementById('f-trim').value;
  const sito = document.getElementById('f-sito').value;

  document.getElementById('hdr-period').textContent = `${trim} ${anno}${sito!=='ALL'?' — '+sito.split(' ')[0]:''}`;
  document.getElementById('dashboard-content').innerHTML = '<div class="loading"><div class="spinner"></div><div>Caricamento...</div></div>';

  try {
    // Query Firestore
    let qAudit = db.collection('audit_hse').where('anno','==',anno).where('trimestre','==',trim);
    let qSR    = db.collection('safereport').where('anno','==',anno).where('trimestre','==',trim);
    let qPrep  = db.collection('preposti').where('anno','==',anno).where('trimestre','==',trim);

    if (sito !== 'ALL') {
      qAudit = qAudit.where('sito','==',sito);
      qSR    = qSR.where('sito','==',sito);
      qPrep  = qPrep.where('sito','==',sito);
    }

    const [audits, safereports, preposti] = await Promise.all([
      qAudit.get(), qSR.get(), qPrep.get()
    ]);

    DATA.audits      = audits.docs.map(d=>d.data());
    DATA.safereports = safereports.docs.map(d=>d.data());
    DATA.preposti    = preposti.docs.map(d=>d.data());

    document.getElementById('last-update').textContent = 'Aggiornato: ' + new Date().toLocaleTimeString('it-IT');
    renderDashboard(anno, trim, sito);
  } catch(e) {
    document.getElementById('dashboard-content').innerHTML = `<div class="empty-state">❌ Errore caricamento: ${e.message}</div>`;
  }
}

// ── CALCOLO SPI ───────────────────────────────────────────
function calcSPI() {
  const a = DATA.audits, sr = DATA.safereports, pr = DATA.preposti;
  const scores = {};

  // 1. INFORTUNI
  const infortuni = sr.filter(s=>s.tipo==='infortunio');
  const ggAssenza = infortuni.reduce((sum,s)=>sum+(s.giorni_prognosi||0),0);
  scores.infortuni = ggAssenza===0?5:ggAssenza<=5?4:ggAssenza<=15?3:ggAssenza<=30?2:ggAssenza<=60?1:0;

  // 2. NEAR MISS
  const nm = sr.filter(s=>s.tipo==='near_miss');
  scores.nearmiss = nm.length===0?5:nm.length===1?4:nm.length<=3?3:nm.length<=5?2:1;

  // 3. SEGNALAZIONI
  const segnalazioni = sr.filter(s=>s.tipo==='situazione_pericolosa'||s.tipo==='osservazione');
  const recidive = sr.filter(s=>s.stato==='aperta' && s.tipo==='near_miss').length;
  scores.segnalazioni = Math.max(0, (segnalazioni.length===0?5:segnalazioni.length<=2?4:segnalazioni.length<=5?3:segnalazioni.length<=8?2:1) - recidive);

  // 4. PROCEDURE (da interviste audit)
  const interviste = a.flatMap(x=>x.interviste||[]);
  if (interviste.length === 0) {
    scores.procedure = null; // N.E.
  } else {
    const tot = interviste.length;
    const conoscono = interviste.filter(i=>!(i.risposte_no||[]).includes('d01') && !(i.risposte_no||[]).includes('d08')).length;
    scores.procedure = parseFloat(((conoscono/tot)*5).toFixed(1));
  }

  // 5. DPI (da audit_hse score_dpi)
  if (a.length === 0) { scores.dpi = null; }
  else { scores.dpi = parseFloat((a.reduce((s,x)=>s+(x.score_dpi||0),0)/a.length).toFixed(1)); }

  // 6. ISPEZIONI
  const nIspezioni = a.length;
  scores.ispezioni = nIspezioni>=8?5:nIspezioni>=6?4:nIspezioni>=4?3:nIspezioni>=2?2:nIspezioni>=1?1:0;

  // 7. ORE LAVORATE — dato manuale non ancora in Firestore
  scores.ore = null; // N.E. finché non aggiunto al SafeReport

  // 8. UNSAFE ACTS/CONDITIONS
  if (a.length === 0) { scores.unsafe = null; }
  else {
    const totObs = a.reduce((s,x)=>s+(x.cnt_obs||0)+(x.cnt_nc||0),0);
    const ratio = totObs / a.length;
    scores.unsafe = ratio===0?5:ratio<=1?4:ratio<=2?3:ratio<=3?2:ratio<=5?1:0;
  }

  // 9. CHIUSURA AC
  const acAperte = a.reduce((s,x)=>s+(x.ac_aperte||0),0);
  const acChiuse = a.reduce((s,x)=>s+(x.ac_chiuse||0),0);
  if (acAperte === 0) { scores.ac_chiusura = 5; }
  else { scores.ac_chiusura = parseFloat(((acChiuse/acAperte)*5).toFixed(1)); }

  // 10. CONFORMITA DOCUMENTALE
  const ncDoc = a.reduce((s,x)=>s+(x.conformita_doc||0),0);
  const totVoci = a.length * 5; // 5 voci documentali per audit
  if (totVoci===0) { scores.conformita = null; }
  else { scores.conformita = Math.max(0, parseFloat((5 - (ncDoc/totVoci)*5).toFixed(1))); }

  // 11. FORMAZIONE/BRIEFING
  const nBriefing = pr.reduce((s,p)=>s+(p.briefing_count||0),0);
  scores.formazione = nBriefing===0?3:nBriefing===1?4:5; // scala premiante

  return scores;
}

function calcVotoFinale(scores) {
  let somaPesi = 0, somaScore = 0;
  SPI_CONFIG.forEach(spi => {
    const s = scores[spi.id];
    if (s !== null && s !== undefined) {
      somaScore += s * spi.peso;
      somaPesi  += spi.peso;
    }
  });
  if (somaPesi === 0) return 0;
  // Formula: Voto = (Σ score_i × peso_i) / somaPesi_attivi × 20
  return parseFloat((somaScore / somaPesi * 20).toFixed(1));
}

// ── RENDER ────────────────────────────────────────────────
function renderDashboard(anno, trim, sito) {
  const scores = calcSPI();
  const voto   = calcVotoFinale(scores);
  const banda  = getBanda(voto);
  const a = DATA.audits, sr = DATA.safereports, pr = DATA.preposti;

  let html = '';

  // ── OVERVIEW ──
  const nNC  = a.reduce((s,x)=>s+(x.cnt_nc||0),0);
  const nOBS = a.reduce((s,x)=>s+(x.cnt_obs||0),0);
  const nNM  = sr.filter(s=>s.tipo==='near_miss').length;
  const nBrf = pr.reduce((s,p)=>s+(p.briefing_count||0),0);

  html += `<div class="overview-grid">
    <div class="ov-card blue"><div class="ov-icon">🔍</div><div class="ov-num">${a.length}</div><div class="ov-label">Audit effettuati</div><div class="ov-sub">${trim} ${anno}</div></div>
    <div class="ov-card red"><div class="ov-icon">⚠️</div><div class="ov-num">${nNC}</div><div class="ov-label">Non Conformità</div><div class="ov-sub">${nOBS} Osservazioni</div></div>
    <div class="ov-card amber"><div class="ov-icon">🚨</div><div class="ov-num">${nNM}</div><div class="ov-label">Near Miss</div><div class="ov-sub">${sr.filter(s=>s.tipo==='infortunio').length} Infortuni</div></div>
    <div class="ov-card green"><div class="ov-icon">👷</div><div class="ov-num">${nBrf}</div><div class="ov-label">Briefing HSE</div><div class="ov-sub">${pr.length} controlli preposti</div></div>
  </div>`;

  // ── VOTO FINALE ──
  html += `<div class="section-title">📊 Voto SPI Finale</div>
  <div class="voto-card">
    <div class="voto-circle" style="background:${banda.bg};color:${banda.color}">
      <div class="voto-num">${voto}</div>
      <div class="voto-max">/100</div>
    </div>
    <div class="voto-info">
      <h2 style="color:${banda.color}">${banda.label}</h2>
      <p>Calcolato su ${SPI_CONFIG.filter(s=>scores[s.id]!==null&&scores[s.id]!==undefined).length} di ${SPI_CONFIG.length} indici disponibili${sito!=='ALL'?' per '+sito.split(' ')[0]:' — tutti i siti'}.</p>
      <div class="voto-implic" style="background:${banda.bg};color:${banda.color}">${banda.implic}</div>
    </div>
  </div>`;

  // ── CARD SPI ──
  html += `<div class="section-title">📋 Dettaglio 11 Indici SPI</div><div class="spi-grid">`;
  SPI_CONFIG.forEach(spi => {
    const s = scores[spi.id];
    const isND = s === null || s === undefined;
    const cls  = isND ? 'nd' : getBanda(s/5*100).cls;
    const giu  = isND ? 'N.E.' : getBanda(s/5*100).label;
    const pct  = isND ? 0 : (s/5*100);
    const barColor = isND ? '#bdc3c7' : getBanda(pct).color;
    html += `<div class="spi-card ${cls}">
      <div class="spi-header">
        <span class="spi-name">${spi.nome}</span>
        <span class="spi-peso">peso ${spi.peso}%</span>
      </div>
      <div class="spi-score-row">
        <span class="spi-score ${cls}">${isND?'—':s}</span>
        <span class="spi-max">/ ${spi.max}</span>
      </div>
      <div class="spi-bar-wrap">
        <div class="spi-bar" style="width:${pct}%;background:${barColor}"></div>
      </div>
      <div class="spi-giudizio" style="color:${barColor}">${giu}</div>
      ${isND?'<div class="spi-detail">Dati non disponibili per questo periodo</div>':''}
    </div>`;
  });
  html += '</div>';

  // ── NC PIÙ RICORRENTI ──
  const ncAll = a.flatMap(x=>(x.nc_list||[]).map(nc=>({...nc})));
  const ncMap = {};
  ncAll.forEach(nc => {
    const k = nc.voce_id;
    if (!ncMap[k]) ncMap[k] = { testo: nc.voce_testo||'', sezione: nc.sezione||'', count:0 };
    ncMap[k].count++;
  });
  const ncTop = Object.values(ncMap).sort((a,b)=>b.count-a.count).slice(0,10);

  html += `<div class="section-title">🔴 NC più Ricorrenti</div>
  <div class="table-card">`;
  if (ncTop.length === 0) {
    html += '<div class="empty-state">Nessuna NC registrata in questo periodo.</div>';
  } else {
    ncTop.forEach((nc,i) => {
      html += `<div class="nc-row">
        <span class="nc-rank">${i+1}</span>
        <div class="nc-text">${nc.testo}<span class="nc-sezione">${nc.sezione}</span></div>
        <span class="nc-count">${nc.count}×</span>
      </div>`;
    });
  }
  html += '</div>';

  // ── TABELLA AUDIT PER SITO ──
  const sitiMap = {};
  a.forEach(x => {
    const s = x.sito||'N/D';
    if (!sitiMap[s]) sitiMap[s] = {sito:s, n:0, nc:0, obs:0, giudizi:[]};
    sitiMap[s].n++;
    sitiMap[s].nc  += x.cnt_nc||0;
    sitiMap[s].obs += x.cnt_obs||0;
    if (x.giudizio) sitiMap[s].giudizi.push(x.giudizio);
  });
  const sitiRows = Object.values(sitiMap).sort((a,b)=>b.nc-a.nc);

  html += `<div class="section-title">📍 Riepilogo per Sito</div>
  <div class="table-card">
  <table class="data-table">
    <thead><tr><th>Sito</th><th>Audit</th><th>NC</th><th>OBS</th><th>Giudizi</th></tr></thead>
    <tbody>`;
  if (sitiRows.length === 0) {
    html += '<tr><td colspan="5" style="text-align:center;color:var(--gray-mid)">Nessun audit in questo periodo.</td></tr>';
  } else {
    sitiRows.forEach(r => {
      const critici = r.giudizi.filter(g=>g==='CRITICO').length;
      const riserva = r.giudizi.filter(g=>g==='RISERVA').length;
      const positivi= r.giudizi.filter(g=>g==='POSITIVO').length;
      html += `<tr>
        <td><strong>${r.sito}</strong></td>
        <td>${r.n}</td>
        <td><strong style="color:var(--red)">${r.nc}</strong></td>
        <td><strong style="color:var(--amber)">${r.obs}</strong></td>
        <td>
          ${positivi>0?`<span class="badge ottimo">${positivi} pos</span> `:''}
          ${riserva>0?`<span class="badge discreto">${riserva} ris</span> `:''}
          ${critici>0?`<span class="badge gravemente">${critici} crit</span>`:''}
          ${r.giudizi.length===0?'<span class="badge nd">—</span>':''}
        </td>
      </tr>`;
    });
  }
  html += '</tbody></table></div>';

  // ── ULTIMI EVENTI ──
  const eventiRecenti = [...sr].sort((a,b)=>b.timestamp?.localeCompare(a.timestamp||'')).slice(0,5);
  html += `<div class="section-title">🕐 Ultime Segnalazioni SafeReport</div>
  <div class="table-card">
  <table class="data-table">
    <thead><tr><th>Protocollo</th><th>Tipo</th><th>Sito</th><th>Data</th><th>Stato</th></tr></thead>
    <tbody>`;
  if (eventiRecenti.length === 0) {
    html += '<tr><td colspan="5" style="text-align:center;color:var(--gray-mid)">Nessuna segnalazione in questo periodo.</td></tr>';
  } else {
    const tipoLabel = {near_miss:'Near Miss',infortunio:'Infortunio',lesione:'Lesione',emergenza:'Emergenza',situazione_pericolosa:'Situaz. Pericolosa'};
    eventiRecenti.forEach(e => {
      html += `<tr>
        <td><code style="font-size:11px">${e.id||'—'}</code></td>
        <td>${tipoLabel[e.tipo]||e.tipo||'—'}</td>
        <td>${(e.sito||'—').split(' ')[0]}</td>
        <td>${e.data_ora?.substring(0,10)||'—'}</td>
        <td><span class="badge ${e.stato==='chiusa'?'ottimo':'insufficiente'}">${e.stato||'aperta'}</span></td>
      </tr>`;
    });
  }
  html += '</tbody></table></div>';

  document.getElementById('dashboard-content').innerHTML = html;
}
</script>
</body>
</html>
